{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="glass p-4">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data" class="row g-3">{% csrf_token %}
      {% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}<div class="text-danger small">{{ field.errors }}</div></div>{% endfor %}
      <div class="col-12"><button class="btn btn-accent">Save listing</button></div>
    </form>
  </div>
</section>
{% endblock %}
